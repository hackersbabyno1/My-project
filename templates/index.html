<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บอทตัวน้อย (ตัวเล็ก) - ระบบควบคุมอัจฉริยะ</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: #1e293b;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            font-weight: bold;
        }
        .tab-buttons {
            display: flex;
            gap: 10px;
        }
        .tab-btn {
            background: #334155;
            color: #cbd5e1;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .tab-btn.active {
            background: #2563eb;
            color: white;
        }
        .workspace {
            flex: 1;
            display: none;
            flex-direction: column;
            overflow: hidden;
        }
        .workspace.active {
            display: flex;
        }
        #chat-container {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.95rem;
            line-height: 1.4;
            position: relative;
        }
        .bot-msg { background-color: #1e293b; align-self: flex-start; }
        .user-msg { background-color: #2563eb; align-self: flex-end; }
        
        .speak-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            margin-left: 8px;
            vertical-align: middle;
        }

        #terminal-output {
            flex: 1;
            background-color: #020617;
            color: #4ade80;
            font-family: monospace;
            padding: 15px;
            overflow-y: auto;
            font-size: 0.9rem;
            white-space: pre-wrap;
        }

        .input-bar {
            padding: 12px 15px;
            background-color: #1e293b;
            border-top: 1px solid #334155;
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .input-bar input {
            flex: 1;
            background-color: #0f172a;
            border: 1px solid #475569;
            border-radius: 8px;
            padding: 10px 12px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }
        .btn-action {
            border: none;
            border-radius: 8px;
            padding: 10px 14px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
            color: white;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .btn-chat { background-color: #2563eb; }
        .btn-chat:hover { background-color: #1d4ed8; }
        
        .btn-cmd { background-color: #16a34a; }
        .btn-cmd:hover { background-color: #15803d; }

        .btn-tool {
            background-color: #334155;
            padding: 10px 12px;
            font-size: 1.1rem;
        }
        
        .status-on { background-color: #16a34a !important; box-shadow: 0 0 8px #22c55e; }
        .status-off { background-color: #dc2626 !important; }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }
        .recording { animation: pulse 1s infinite; }
    </style>
</head>
<body>

    <header>
        <span>🤖 บอทตัวน้อย (ออนไลน์)</span>
        <div class="tab-buttons">
            <button class="tab-btn active" onclick="switchTab('chat')">💬 แชทคุย</button>
            <button class="tab-btn" onclick="switchTab('cmd')">💻 Terminal</button>
        </div>
    </header>

    <div id="tab-chat" class="workspace active">
        <div id="chat-container">
            <div class="message bot-msg">
                👶 คุยกับหนู หรือสั่งงานผ่านแชทได้เลยค่ะป๋า! ❤️
                <button class="speak-btn" onclick="speakText(this.previousSibling.textContent)">🔊</button>
            </div>
        </div>
        <div class="input-bar">
            <button class="btn-action btn-tool status-off" id="mic-btn" onclick="toggleSpeechRecognition()" title="เปิด/ปิด ไมค์พูด">🎙️</button>
            <button class="btn-action btn-tool status-on" id="speaker-main-btn" onclick="toggleGlobalSpeaker()" title="เปิด/ปิด เสียงลำโพง">🔊</button>
            <input type="text" id="chat-input" placeholder="พิมพ์ข้อความคุยกับตัวเล็ก..." onkeypress="if(event.key==='Enter') sendChat()">
            <button class="btn-action btn-chat" onclick="sendChat();">📤 ส่งแชท</button>
            <button class="btn-action btn-cmd" onclick="sendAsCommand();">💻 ส่งเปน Cmd</button>
        </div>
    </div>

    <div id="tab-cmd" class="workspace">
        <div id="terminal-output">System Terminal Ready...
พิมพ์คำสั่งระบบ (เช่น python3, ls, status) แล้วกดปุ่มรัน Command ครับป๋า</div>
        <div class="input-bar">
            <input type="text" id="cmd-input" placeholder="พิมพ์ Command ระบบ..." style="font-family: monospace;" onkeypress="if(event.key==='Enter') sendCommand()">
            <button class="btn-action btn-cmd" onclick="sendCommand()">🚀 รัน Command</button>
        </div>
    </div>

    <script>
        let speakerEnabled = true;

        function switchTab(tab) {
            document.querySelectorAll('.workspace').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            if(tab === 'chat') {
                document.getElementById('tab-chat').classList.add('active');
                event.target.classList.add('active');
            } else {
                document.getElementById('tab-cmd').classList.add('active');
                event.target.classList.add('active');
            }
        }

        function toggleGlobalSpeaker() {
            speakerEnabled = !speakerEnabled;
            const btn = document.getElementById('speaker-main-btn');
            if (speakerEnabled) {
                btn.className = "btn-action btn-tool status-on";
            } else {
                btn.className = "btn-action btn-tool status-off";
                window.speechSynthesis.cancel();
            }
        }

        function speakText(text) {
            if (!speakerEnabled) return;
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text.replace(/🔊/g, '').trim());
                utterance.lang = 'th-TH';
                window.speechSynthesis.speak(utterance);
            }
        }

        let recognition = null;
        function toggleSpeechRecognition() {
            const micBtn = document.getElementById('mic-btn');
            const input = document.getElementById('chat-input');

            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert("เบราว์เซอร์นี้ไม่รองรับการแปลงเสียงเป็นข้อความค่ะป๋า");
                return;
            }

            if (!recognition) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                recognition.lang = 'th-TH';
                recognition.continuous = false;
                recognition.interimResults = false;

                recognition.onstart = () => { micBtn.className = "btn-action btn-tool status-on recording"; };
                recognition.onend = () => { micBtn.className = "btn-action btn-tool status-off"; };
                recognition.onresult = (event) => { input.value = event.results[0][0].transcript; };
                recognition.onerror = () => { micBtn.className = "btn-action btn-tool status-off"; };
            }

            if (micBtn.classList.contains('status-on')) {
                recognition.stop();
                micBtn.className = "btn-action btn-tool status-off";
            } else {
                recognition.start();
            }
        }

        async function sendChat() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if(!text) return;

            const chatBox = document.getElementById('chat-container');
            chatBox.innerHTML += `<div class="message user-msg">${text}</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message: text})
                });
                const data = await res.json();
                const replyText = data.reply || "หัวใจตัวเล็กได้รับข้อความแล้วค่ะ!";
                chatBox.innerHTML += `
                    <div class="message bot-msg">
                        ${replyText}
                        <button class="speak-btn" onclick="speakText(this.previousSibling.textContent)">🔊</button>
                    </div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
                speakText(replyText);
            } catch(e) {
                chatBox.innerHTML += `<div class="message bot-msg">⚠️ เชื่อมต่อติดขัดค่ะป๋า</div>`;
            }
        }

        async function sendAsCommand() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if(!text) return;

            const chatBox = document.getElementById('chat-container');
            chatBox.innerHTML += `<div class="message user-msg">💻 [Cmd]: ${text}</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message: "!" + text})
                });
                const data = await res.json();
                chatBox.innerHTML += `<div class="message bot-msg" style="font-family: monospace; white-space: pre-wrap;">${data.reply}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch(e) {
                chatBox.innerHTML += `<div class="message bot-msg">⚠️ รันคำสั่งไม่สำเร็จค่ะป๋า</div>`;
            }
        }

        async function sendCommand() {
            const input = document.getElementById('cmd-input');
            const cmd = input.value.trim();
            if(!cmd) return;

            const term = document.getElementById('terminal-output');
            term.innerHTML += `\n\nroot@bot:~# ${cmd}\n`;
            input.value = '';
            term.scrollTop = term.scrollHeight;

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message: "!" + cmd})
                });
                const data = await res.json();
                term.innerHTML += data.reply;
                term.scrollTop = term.scrollHeight;
            } catch(e) {
                term.innerHTML += `[Error] ไม่สามารถรันคำสั่งได้`;
            }
        }
    </script>
</body>
</html>
